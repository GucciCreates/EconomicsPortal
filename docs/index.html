<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Only this site, Google Fonts and the class's Apps Script backend may be used. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
    />
    <title>
      EconomicsPortal — Class Portal for Dr. Numan's Economics Class
    </title>
    <meta
      name="description"
      content="Academic class portal and gradebook ledger for Dr. Numan's Economics class, built by Shehroz's team."
    />
    <meta name="theme-color" content="#edf1f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1c1a" media="(prefers-color-scheme: dark)" />

    <!-- Installable app (PWA) -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="EconPortal" />

    <!-- Favicon -->
    <link
      rel="icon"
      href="./icons/icon.svg" type="image/svg+xml"
    />

    <!-- Google Fonts: Bricolage Grotesque 600/700 (headings) + Instrument Sans 400–700 (text).
         The stylesheet is preloaded; the font files are fetched from it with display=swap,
         so text shows immediately in a fallback font. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Charts (Chart.js) load on demand from ./js/vendor/ when a chart tab opens. -->

    <!-- Main Ledger Stylesheet (Cache Busted) -->
    <link rel="stylesheet" href="./css/style.css?v=6.0.0" />
  </head>
  <body>
    <!-- Demo / Fallback Mode Indicator Banner -->
    <div id="demo-banner"></div>

    <!-- Shared Top Navigation Bar -->
    <header class="site-header" id="site-header"></header>

    <!-- Dynamic Main Content (Login or Role Dashboards) -->
    <main class="main-wrapper" id="main-content">
      <p class="loading-note">Loading EconomicsPortal…</p>
    </main>

    <!-- Persistent Footer -->
    <footer id="site-footer"></footer>

    <!-- Application Script (Cache Busted) -->
    <script type="module" src="./js/app.js?v=6.0.0"></script>
  </body>
</html>

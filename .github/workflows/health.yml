# Daily check that the live site and the Apps Script server answer (AUDIT_v7 F10).
# Free on public repositories. Uses no secrets: it never signs in or touches
# class data. If something is wrong it opens one issue (or comments on the
# open one) so the owner gets a GitHub notification.
#
# Note: GitHub pauses scheduled workflows after 60 days without commits.
# Re-enable it under Actions → Live health check if that happens.
name: Live health check

on:
  schedule:
    - cron: '23 2 * * *' # 07:23 in Pakistan (UTC+5), every day
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright (check tool only)
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Check the live server and sign-in page
        id: check
        run: |
          set +e
          node scripts/health-check.js > report.txt 2>&1
          code=$?
          cat report.txt
          echo "failed=$([ $code -ne 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open or update an issue if it failed
        if: steps.check.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Live health check failed"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="$(printf 'The daily check found a problem on %s:\n\n```\n%s\n```\n\nRun: %s\n\nClose this issue once it is fixed.' "$(date -u '+%Y-%m-%d %H:%M UTC')" "$(cat report.txt)" "$run_url")"
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
          exit 1

# Free on public repositories. Runs on every pull request and on pushes to main.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: docs/ matches the source (run `npm run build` and commit if this fails)
        run: |
          npm run build
          git status --porcelain docs
          git diff --exit-code --stat -- docs
          test -z "$(git status --porcelain docs)"

      - name: Unit and backend tests
        run: npm test

      - name: Install Playwright (test tool only, not shipped to the site)
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Keep screenshots if the browser tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/e2e/screenshots/
          if-no-files-found: ignore
